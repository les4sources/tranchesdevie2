# Manifeste des captures d'écran du centre d'aide.
#
# Source unique de vérité : les chapitres markdown y font référence via
# `![légende](shot:SLUG)`, et la tâche `bin/rails aide:screenshots` régénère
# chaque PNG (app/assets/images/aide/SLUG.png) en pilotant le vrai admin.
#
# Le manifeste sert aussi de preuve visuelle des refontes de l'admin : chaque
# section a au moins une capture, si bien qu'une PR de restyle montre son
# avant/après dans le diff des PNG. Les données de démo étant déterministes
# (graine fixe côté spec), un PNG qui bouge signale un vrai changement d'écran.
#
# Champs :
#   slug     : nom du fichier PNG et référence markdown (obligatoire)
#   path     : URL relative à visiter (ex. /admin/orders)
#   record   : résout un enregistrement de démo (order | bake_day | customer |
#              product | group | pickup_location). Seul, il vise la fiche ;
#              combiné à `path`, il y remplace `:id` (ex. /admin/orders/:id/edit)
#   selector : capture seulement cet élément CSS (sinon page entière)
#   auth     : false pour les pages hors authentification (ex. login)
#
# Après avoir ajouté une entrée ici + un `![..](shot:SLUG)` dans un chapitre,
# lance : bin/rails aide:screenshots

# --- Coque & connexion -------------------------------------------------------
- slug: login
  path: /admin/login
  auth: false

- slug: nav
  path: /admin/orders
  selector: "nav"

# --- Commandes ---------------------------------------------------------------
- slug: orders-index
  path: /admin/orders

- slug: order-show
  record: order

- slug: order-new
  path: /admin/orders/new

- slug: order-edit
