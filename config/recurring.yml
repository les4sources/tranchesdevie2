# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  mark_orders_ready:
    class: MarkOrdersReadyJob
    schedule: at 6:15 pm every day
    description: "Mark orders as ready and send SMS notifications at 6:15pm"

  # Libère la capacité réservée par les paiements en ligne abandonnés (>30 min)
  expire_stale_pending_orders:
    class: ExpireStalePendingOrdersJob
    schedule: "*/10 * * * *"
    description: "Cancel abandoned online checkouts (pending > 30 min) to free bake capacity"

  # Traitement des commandes du calendrier, TOUS LES JOURS à 12h05 (#274, recalé
  # en #292 avec le cut-off).
  #
  # Le rythme est quotidien parce que le cut-off est fixé PAR FOURNÉE et non par
  # jour de semaine : il vaut aujourd'hui jeudi 12h00 pour les fournées du
  # vendredi et lundi 12h00 pour celles du mardi, et il peut changer. Un cron
  # calé sur des jours fixes passait systématiquement à côté : trop tôt pour le
  # cut-off du jeudi, trop tard pour la fournée du vendredi. Les commandes
  # restaient `planned` le jour de la cuisson — absentes de la feuille compta —
  # et le client ne recevait jamais son SMS.
  #
  # Le job ne traite que les fournées dont le cut-off est passé : le passer tous
  # les jours est sans effet les jours sans cut-off.
  process_planned_orders:
    class: ProcessPlannedOrdersJob
    schedule: every day at 12:05 pm Europe/Brussels
    description: "Process planned orders and debit wallets once a bake day cut-off has passed"

  # Rattrape les commissions Stripe manquantes (stripe_fee_cents NULL).
  # La BalanceTransaction Stripe n'est pas toujours disponible au moment du
  # finalize (notamment pour Bancontact, asynchrone) : ce passage récurrent
  # comble les trous. Borné et idempotent (ne traite que Payment.succeeded avec
  # stripe_fee_cents NULL), toutes les 3 heures.
  backfill_stripe_fees:
    class: BackfillStripeFeesJob
    schedule: "0 */3 * * *"
    description: "Backfill missing Stripe fees (stripe_fee_cents NULL) every 3 hours"

  # Cycle de vie des Pizza parties (#pizza-parties), toutes les 10 minutes.
  #
  # La cadence est courte pour la même raison que `expire_stale_pending_orders` :
  # les échéances sont portées par le CUT-OFF DE CHAQUE FOURNÉE et ne tombent
  # jamais à heure fixe. Un passage quotidien honorerait une sollicitation ou une
  # expiration jusqu'à 24 h trop tard — le client serait sollicité après le
  # cut-off, ou son créneau rendu bien après avoir dû l'être.
  #
  # Les deux jobs sont idempotents : chaque envoi pose son horodatage
  # (`reminded_at`, `payment_prompted_at`, `payment_reminded_at`), qui sert de
  # garde au passage suivant.
  party_request_lifecycle:
    class: PartyRequestLifecycleJob
    schedule: "*/10 * * * *"
    description: "Relance la boulangerie sur une demande de Pizza party sans réponse et clôture celles que le cut-off a dépassées"

  party_payment_lifecycle:
    class: PartyPaymentLifecycleJob
    schedule: "*/10 * * * *"
    description: "Sollicite, relance et fait expirer le paiement des Pizza parties validées, en interrogeant Stripe avant d'annuler"

  # Alerte « solde insuffisant », TOUS LES JOURS à 08h00 (#274, recalé en #292) —
  # soit quatre heures avant un cut-off à 12h00 (CheckInsufficientBalanceJob::WARNING_LEAD).
  # Quotidien pour la même raison que le job ci-dessus : le cut-off est porté par
  # la fournée, pas par le jour de semaine. Pas plus tôt : ce job envoie un SMS au
  # client, et quatre heures suffisent largement pour recharger un portefeuille.
  check_balance:
    class: CheckInsufficientBalanceJob
    schedule: every day at 8:00 am Europe/Brussels
    description: "Warn customers with insufficient balance four hours before a bake day cut-off"
